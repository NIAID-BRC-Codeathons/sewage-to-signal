<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAE pipeline</title>
<style>
  :root {
    --bg:#f7f7f5; --panel:#fff; --line:#e2e2dd; --ink:#1c1c1a; --dim:#6b6b64;
    --accent:#2f6f4f; --warn:#9a5b12; --bad:#a33a2a; --run:#2c5d8a;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    /* UMAP scatter. Deliberately not the status tokens: --accent and --warn
       already mean "done" and "warning", and reusing them put grey --dim on
       the "known" class, where it both collided with the corpus cloud and
       left known-vs-partial at a normal-vision deltaE of 10.7 — a pair
       full-colour readers cannot separate. These three validate on all pairs
       in both modes, which is what a scatter needs.

       They started as the triage-class colours and are now the categorical
       slots for *any* column, which is the same thing: the triage class is one
       categorical column. `category` still lands on exactly these three
       because the server pins its domain order to known → partial → dark, so
       nothing here special-cases it. Three and no more — a scatter puts every
       pair on screen at once, and a fourth hue cannot clear the all-pairs
       floors, so the tail of a wider column folds into --cat-other. */
    --map-surface:#f0f0f0; --map-context:#4b4b44;
    --cat-1:#2a78d6; --cat-2:#eb6834; --cat-3:#1baf7a;
    /* The folded tail. Grey, like every "other", but a different grey from
       the corpus backdrop (deltaE 25.6 apart) because both are on screen
       together and they mean different things. */
    --cat-other:#8a8a82;
    /* Magnitude: one hue, light → dark, five steps. Eight failed the ordinal
       gate — adjacent lightness gaps of 0.047 against a 0.06 floor, and a
       lightest step at 1.85:1 that disappeared into the surface. */
    --ramp-1:#6da7ec; --ramp-2:#3987e5; --ramp-3:#256abf;
    --ramp-4:#184f95; --ramp-5:#0d366b;
    /* Overlay of two samples. A separate pair, not a reuse of the class
       colours: an overlay colours by *sample*, so borrowing "known" blue for
       sample A would have the same swatch mean two things across two modes of
       the same plot. Violet/amber over magenta/teal because the latter
       collapses under deuteranopia (simulated deltaE 3.6, indistinguishable);
       this pair holds a simulated deltaE of at least 27 under deuter-, prot-
       and tritanopia in both themes, and both stay separable from the corpus
       grey. */
    --map-a:#7b4fd0; --map-b:#c79000;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#16161a; --panel:#1e1e23; --line:#32323a; --ink:#e8e8e4; --dim:#9a9a92;
    --accent:#6dbd8f; --warn:#d9a05b; --bad:#e08472; --run:#79aede;
    --map-surface:#151518; --map-context:#9a9a92;
    --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70;
    --cat-other:#6f6f68;
    /* Dark steps are chosen for the dark band, not flipped from the light
       ramp. */
    --ramp-1:#cde2fb; --ramp-2:#9ec5f4; --ramp-3:#6da7ec;
    --ramp-4:#3987e5; --ramp-5:#256abf;
    /* Was #d9a93a, which failed the dark lightness band at L 0.76 against a
       0.48–0.67 window — the amber glared next to the violet. */
    --map-a:#9b7ae8; --map-b:#c98500;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif}
  header{padding:18px 16px 12px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 4px;font-size:17px;font-weight:600;letter-spacing:-.01em}
  .meta{color:var(--dim);font-size:12px;font-family:var(--mono);
        word-break:break-all}
  main{max-width:1000px;margin:0 auto;padding:16px}
  section{background:var(--panel);border:1px solid var(--line);border-radius:8px;
          padding:14px;margin-bottom:14px}
  h2{margin:0 0 10px;font-size:13px;font-weight:600;text-transform:uppercase;
     letter-spacing:.06em;color:var(--dim)}
  .run{border-top:1px solid var(--line);padding:10px 0}
  .run:first-of-type{border-top:0}
  /* The toggle is the header and the stage strip, never the whole block. When
     the block was the toggle, every click inside what it opened - a filter
     dropdown, a point, a preview - closed it, and each control had to opt out
     by hand. Anything that forgot to was a trapdoor. */
  .run-head,.strip{cursor:pointer}
  .run-head:hover .name{text-decoration:underline}
  .run-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .detail,.map,.preview{cursor:auto}
  .name{font-family:var(--mono);font-weight:600}
  .sub{color:var(--dim);font-size:12px;font-family:var(--mono)}
  .strip{display:flex;gap:3px;margin-top:8px;flex-wrap:wrap}
  .cell{flex:1 1 60px;min-width:60px;padding:4px 5px;border-radius:4px;
        font:11px/1.3 var(--mono);text-align:center;border:1px solid var(--line);
        color:var(--dim);background:transparent}
  .cell.done{background:color-mix(in srgb,var(--accent) 16%,transparent);
             border-color:color-mix(in srgb,var(--accent) 45%,transparent);
             color:var(--ink)}
  .cell.started{background:color-mix(in srgb,var(--warn) 16%,transparent);
                border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
  .cell.active{background:color-mix(in srgb,var(--run) 20%,transparent);
               border-color:var(--run);color:var(--ink);
               animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.55}}
  @media (prefers-reduced-motion:reduce){.cell.active{animation:none}}
  .detail{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
  table{width:100%;border-collapse:collapse;font-size:12px;font-family:var(--mono)}
  td,th{text-align:left;padding:4px 8px 4px 0;vertical-align:top;
        border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:600}
  td.k{color:var(--dim);white-space:nowrap}
  label{display:block;font-size:12px;color:var(--dim);margin:8px 0 3px}
  input,select,button{font:13px var(--mono);padding:6px 8px;border-radius:5px;
        border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  input,select{width:100%}
  button{cursor:pointer;background:var(--ink);color:var(--bg);border-color:var(--ink);
         font-weight:600;width:auto;padding:7px 14px}
  button:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  label.inline{display:flex;gap:6px;align-items:center;margin:0;
               font:13px var(--mono);color:var(--ink)}
  label.inline input{width:auto}
  .row>div{flex:1 1 180px}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:5px;
      padding:10px;overflow:auto;max-height:280px;font:11.5px/1.45 var(--mono);
      white-space:pre-wrap;word-break:break-word;margin:6px 0 0}
  .badge{font:11px var(--mono);padding:2px 7px;border-radius:99px;
         border:1px solid var(--line);color:var(--dim)}
  .badge.pending{color:var(--dim);border-color:var(--line);
                 border-style:dashed}
  .badge.running{color:var(--run);border-color:var(--run)}
  .badge.finished{color:var(--accent);border-color:var(--accent)}
  .badge.failed{color:var(--bad);border-color:var(--bad)}
  .msg{font-size:12px;font-family:var(--mono);margin-top:8px}
  .msg.err{color:var(--bad)} .msg.ok{color:var(--accent)}
  .empty{color:var(--dim);font-size:13px;font-style:italic}
  details summary{cursor:pointer;color:var(--dim);font-size:12px;
                  font-family:var(--mono);margin-top:6px}
  .files{display:flex;gap:5px;flex-wrap:wrap;padding:4px 0 8px}
  .chip{font:11px var(--mono);padding:3px 8px;border-radius:4px;cursor:pointer;
        border:1px solid var(--line);background:var(--bg);color:var(--dim)}
  .chip:hover{color:var(--ink);border-color:var(--dim)}
  .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .chip.binary{opacity:.5;cursor:not-allowed}
  .preview{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
  .preview .cap{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;
                margin-bottom:6px}
  .scroll{overflow:auto;max-height:340px;border:1px solid var(--line);
          border-radius:5px;background:var(--bg)}
  .scroll table{font-size:11.5px}
  .scroll td,.scroll th{padding:4px 10px 4px 6px;white-space:nowrap;
                        max-width:340px;overflow:hidden;text-overflow:ellipsis}
  .scroll th{position:sticky;top:0;background:var(--panel)}
  .scroll pre{border:0;margin:0;max-height:none}
  .map{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
  .map-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
           font:11px var(--mono);color:var(--dim);margin-bottom:6px}
  .map svg{width:100%;height:auto;display:block;border:1px solid var(--line);
           border-radius:5px;background:var(--map-surface)}
  .map circle{cursor:pointer}
  .map-bar select{width:auto;padding:3px 6px;font:11px var(--mono)}
  .map-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
           font:11px var(--mono);color:var(--dim);margin-bottom:6px}
  .map-ctl select,.map-ctl input{width:auto;padding:2px 5px;font:11px var(--mono)}
  .map-ctl input[type=number]{width:72px}
  .term{display:inline-flex;gap:5px;align-items:center;padding:2px 5px;
        border:1px solid var(--line);border-radius:4px;background:var(--bg)}
  .term>b{font-weight:600;color:var(--ink)}
  .val{cursor:pointer;border:1px solid var(--line);border-radius:3px;
       padding:0 4px;background:var(--panel);color:var(--ink)}
  .val:hover{border-color:var(--bad);color:var(--bad)}
  .drop{cursor:pointer;color:var(--dim);padding:0 2px}
  .drop:hover{color:var(--bad)}
  .ramp{display:inline-flex;align-items:center;gap:0}
  .ramp i{width:14px;height:9px;display:inline-block}
  .ramp i:first-child{border-radius:2px 0 0 2px}
  .ramp i:last-child{border-radius:0 2px 2px 0}
  .key i.hollow{background:transparent;border:1.5px solid var(--dim)}
  .key{display:inline-flex;gap:4px;align-items:center}
  .key i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
       font:11px var(--mono);color:var(--dim);margin-top:8px}
  .bar .path{word-break:break-all}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;
       overflow:hidden}
  .seg button{border:0;border-radius:0;padding:3px 9px;font:11px var(--mono);
              font-weight:400;background:var(--bg);color:var(--dim);width:auto}
  .seg button.on{background:var(--ink);color:var(--bg)}
  /* Generated launch form. Every control below is built from /api/pipeline,
     so these rules style shapes — a fieldset per stage, a hint under a
     control — and never a particular stage or parameter. */
  .plan{display:flex;gap:3px;flex-wrap:wrap;margin:8px 0 2px;align-items:center}
  .plan .sub{margin-right:4px}
  .plan .cell{flex:0 0 auto;min-width:0;padding:3px 8px}
  fieldset{border:1px solid var(--line);border-radius:6px;padding:8px 12px 12px;
           margin:10px 0 0;min-width:0}
  legend{font:12px var(--mono);color:var(--ink);padding:0 6px}
  legend .sub{font-weight:400}
  .hint{color:var(--dim);font-size:11px;font-family:var(--mono);margin-top:3px;
        line-height:1.4}
  .hint.bad{color:var(--bad)}
  .sel{margin-top:8px}
  .sel input{font-size:12px}
  .cols{margin-top:4px;display:flex;gap:4px;flex-wrap:wrap;align-items:baseline}
  .col{font:10.5px var(--mono);padding:1px 5px;border-radius:3px;
       border:1px solid var(--line);color:var(--dim)}
  code{font:11px var(--mono);background:var(--bg);padding:1px 4px;
       border-radius:3px;border:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>SAE pipeline</h1>
  <div class="meta" id="env">connecting…</div>
</header>
<main>
  <section id="new-run">
    <h2>New run</h2>
    <div class="row">
      <div>
        <label for="file">Upload a file</label>
        <input type="file" id="file">
      </div>
      <div>
        <label for="input">…or pick an existing one</label>
        <select id="input"></select>
      </div>
    </div>
    <div class="row">
      <div><label for="kind">Input kind</label>
        <select id="kind">
          <option value="fastq">fastq (reads)</option>
          <option value="contigs">contigs</option>
          <option value="proteins">proteins</option>
        </select></div>
      <div><label for="input2">Second mate (paired fastq, optional)</label>
        <select id="input2"><option value="">—</option></select></div>
      <div><label for="sample">Sample name</label>
        <input id="sample" placeholder="CHI-B" maxlength="64"></div>
    </div>
    <div class="row">
      <div><label for="target">Produce</label><select id="target"></select></div>
      <div id="fast-wrap" style="display:none">
        <label for="fast">Speed</label>
        <label class="inline"><input type="checkbox" id="fast"> skip assembly
          — translate reads directly</label>
        <div class="hint" id="fast-hint"></div>
      </div>
    </div>
    <!-- Everything below is generated from /api/pipeline. There is no stage
         name, parameter name or predicate in this file. -->
    <div id="plan" class="plan"></div>
    <details id="opts-wrap">
      <summary>Stage options and selections</summary>
      <div id="opts"></div>
    </details>
    <div style="margin-top:12px"><button id="go">Start run</button></div>
    <div class="msg" id="msg"></div>
  </section>

  <section>
    <h2>Jobs</h2>
    <div id="jobs"><p class="empty">No runs started from here yet.</p></div>
  </section>

  <section>
    <h2>Runs</h2>
    <div id="runs"><p class="empty">Scanning…</p></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let STAGES = [], openRun = null, openJob = null, readOnly = false;
// The pipeline's description of itself, from /api/pipeline: stages, their
// parameters, the entity levels, which stage fills which role. Every control
// and every label below is built out of this, so this file names no stage.
let PIPELINE = null, DATA_FILES = [];
// Artifact browsing. The server normalises every file to text / table / json,
// so nothing here knows a stage's schema — a stage can change its columns, or
// a new stage appear, with no change to this file.
let artifacts = {}, pendingArtifacts = {}, sel = null, selData = null;
let jobLog = {};                 // job id -> last fetched log text
// The script each job ran as: {text, ok}. Unlike the log it cannot
// change once the job has started, so a successful fetch is kept and never repeated —
// but only a successful one. Caching a failure would outlive its cause: a
// server restarted mid-poll would leave the pane reading "Failed to fetch"
// for as long as the tab stayed open, with nothing to retry it.
let jobScript = {}, jobPane = "output";
// Feature map: s06's top-K vectors reduced to 2D. Fetched only when asked,
// because t-SNE over a thousand proteins takes seconds.
let mapRun = null, mapMode = "reference", mapData = null, mapErr = null, mapHover = null;
// The second run drawn in the same layout, or null for one run on its own.
let mapB = null;
// Which column the plot is coloured by ("" lets the server choose its default,
// "sample" is the overlay's own encoding), and the filter as one term per
// column — one per column because two terms on the same column would be ANDed
// into a contradiction, where picking two values plainly means either.
let mapColor = "", mapFilter = {};
// Every request's identity, so a colour or filter change refetches while the
// 2s poll does not.
let mapKey = null;
// Every run in the last /api/state, so the compare picker can offer the other
// ones. renderMap is reached through renderDetail and is not passed the list.
let allRuns = [];
// Fixed slot order. The server hands back the value -> slot mapping computed
// over the *unfiltered* column, so narrowing the plot never repaints the
// points that survive — a colour that changes meaning when you filter is
// worse than no colour. Slots are never cycled to fit a column's width: the
// tail folds into one neutral instead.
const CAT_COLOR = ["var(--cat-1)", "var(--cat-2)", "var(--cat-3)"];
const CAT_OTHER = "var(--cat-other)";
const RAMP = ["var(--ramp-1)", "var(--ramp-2)", "var(--ramp-3)",
              "var(--ramp-4)", "var(--ramp-5)"];
const SIDE_COLOR = {a: "var(--map-a)", b: "var(--map-b)"};

// A point's colour from the slot the server resolved: null is a missing value
// and -1 the folded tail, and both are neutrals rather than a borrowed hue.
function slotColor(p, domain) {
  if (!domain) return "var(--map-context)";
  if (p.s == null) return null;                  // null => draw it hollow
  if (domain.kind === "numeric") return RAMP[p.s] || RAMP[0];
  return p.s < 0 ? CAT_OTHER : (CAT_COLOR[p.s] || CAT_OTHER);
}

const fmtNum = v => v == null ? "—"
  : (Math.abs(v) >= 1e4 || (v !== 0 && Math.abs(v) < 1e-3))
    ? Number(v).toExponential(1)
    : (Number.isInteger(v) ? String(v) : Number(v).toFixed(3).replace(/0+$/, ""));

const esc = v => String(v == null ? "" : v)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;");

const fmtBytes = n => n == null ? "—" :
  n < 1024 ? n + " B" : n < 1048576 ? (n/1024).toFixed(1) + " KB" :
  n < 1073741824 ? (n/1048576).toFixed(1) + " MB" : (n/1073741824).toFixed(2) + " GB";
const fmtSecs = s => s == null ? "—" :
  s < 60 ? s.toFixed(1) + "s" : (s/60).toFixed(1) + "m";

// The 2s poll used to rewrite innerHTML unconditionally, which destroys and
// recreates every scrollable element and so resets scrollTop — scrolling a
// preview or a log would snap back to the top. Only touch the DOM when the
// markup actually changed, and carry scroll offsets across the writes that do
// happen. Elements that can scroll carry a stable data-key to be matched by.
function paint(el, html) {
  if (el._html === html) return false;
  const saved = [...el.querySelectorAll("[data-key]")]
    .map(n => [n.dataset.key, n.scrollTop, n.scrollLeft]);
  const y = window.scrollY, x = window.scrollX;
  el.innerHTML = html;
  el._html = html;
  for (const [key, top, left] of saved) {
    const n = el.querySelector(`[data-key="${CSS.escape(key)}"]`);
    if (n) { n.scrollTop = top; n.scrollLeft = left; }
  }
  window.scrollTo(x, y);        // a height change must not move the page
  return true;
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  const d = await r.json().catch(() => ({error: r.statusText}));
  if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
  return d;
}

// The strip shows the stages this run actually has, in the order the server
// found them — not a fixed list. A run from a different pipeline, or from a
// version of this one with stages since removed, still draws correctly.
function stageCells(run, activeStage) {
  const known = {};
  for (const s of (PIPELINE?.stages || [])) known[s.name] = s;
  return (run.order || Object.keys(run.stages)).map(s => {
    const st = run.stages[s];
    let cls = "cell";
    if (st && st.state === "done") cls += " done";
    else if (st) cls += " started";
    if (s === activeStage) cls += " active";
    const d = known[s];
    const tip = d ? `${s} — ${d.title}: ${d.summary}` : s;
    return `<div class="${cls}" title="${esc(tip)}">` +
           `${esc(d ? d.title : s.replace(/^s\d+_/, ""))}</div>`;
  }).join("");
}

function renderFiles(runId, stage) {
  const files = (artifacts[runId] || {})[stage];
  if (!files) return "";
  return `<div class="files">` + files.map(f => {
    const on = sel && sel.run === runId && sel.stage === stage && sel.file === f.name;
    const cls = "chip" + (f.kind === "binary" ? " binary" : "") + (on ? " on" : "");
    return `<span class="${cls}" data-run="${esc(runId)}" data-stage="${esc(stage)}" ` +
           `data-file="${esc(f.name)}" title="${esc(f.kind)} · ${fmtBytes(f.bytes)}">` +
           `${esc(f.name)}</span>`;
  }).join("") + `</div>`;
}

function renderPreview() {
  if (!sel) return "";
  const head = `<div class="cap"><span class="name">${esc(sel.file)}</span>` +
    (selData ? `<span class="sub">${esc(selData.kind)} · ${fmtBytes(selData.bytes)}` +
      (selData.kind === "table"
        ? ` · showing ${selData.rows.length}` +
          (selData.total_rows ? ` of ${selData.total_rows}` : "") + ` rows`
        : "") + `</span>` : `<span class="sub">loading…</span>`) + `</div>`;
  if (!selData) return `<div class="preview">${head}</div>`;
  let body;
  const key = esc(`prev|${sel.run}|${sel.stage}|${sel.file}`);
  if (selData.kind === "table") {
    body = `<div class="scroll" data-key="${key}"><table><tr>` +
      selData.columns.map(c => `<th>${esc(c)}</th>`).join("") + `</tr>` +
      selData.rows.map(r => `<tr>` +
        r.map(v => `<td title="${esc(v)}">${esc(v)}</td>`).join("") + `</tr>`).join("") +
      `</table></div>`;
  } else if (selData.kind === "json") {
    body = `<div class="scroll" data-key="${key}"><pre>` +
           `${esc(JSON.stringify(selData.json, null, 2))}</pre></div>`;
  } else {
    body = `<div class="scroll" data-key="${key}"><pre>${esc(selData.text || "")}</pre></div>`;
  }
  return `<div class="preview">${head}${body}</div>`;
}

// Drawing sample A and then sample B buries whichever was drawn first under
// whichever is larger, which reads as "B is everywhere" no matter what is
// there. Merge the two in proportion so occlusion falls evenly on both.
function interleave(points) {
  const a = points.filter(p => p.side === "a");
  const b = points.filter(p => p.side === "b");
  if (!a.length || !b.length) return points;
  const out = [];
  let i = 0, j = 0;
  while (i < a.length || j < b.length) {
    if (j >= b.length ||
        (i < a.length && (i + 0.5) / a.length <= (j + 0.5) / b.length)) out.push(a[i++]);
    else out.push(b[j++]);
  }
  return out;
}

function mapScatter(d, fill, label, opacity, ringSide) {
  const W = 760, H = 420, pad = 26;
  const all = d.points.concat(d.context || []);
  const xs = all.map(p => p.x), ys = all.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  const sx = v => pad + (x1 === x0 ? 0.5 : (v - x0) / (x1 - x0)) * (W - 2 * pad);
  // SVG y grows downward; flip so the plot reads the usual way up.
  const sy = v => H - pad - (y1 === y0 ? 0.5 : (v - y0) / (y1 - y0)) * (H - 2 * pad);
  // The corpus is backdrop, so it stays neutral — no series is grey now, so
  // grey reads unambiguously as "not this run". It was --line at 0.55, which
  // on the white panel was a contrast of about 1.05 against its own
  // background: present in the DOM and invisible on screen.
  const ctx = (d.context || []).map(p =>
    `<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="1.6"
      fill="var(--map-context)" fill-opacity="0.4"/>`).join("");
  // Two encodings share one mark. Colour carries the value; when an overlay is
  // coloured by a column rather than by sample, the second run keeps a dark
  // ring so the sides stay separable without spending a hue on them. A ring
  // reads at 2.6px where a different shape does not. `null` from fill() means
  // the value is missing, drawn hollow - absence is not a colour.
  const dots = interleave(d.points).map(p => {
    const c = fill(p), ring = ringSide && p.side === ringSide;
    const stroke = ring ? "var(--ink)" : (c === null ? "var(--dim)"
                                                     : "var(--map-surface)");
    // A hollow ring at full strength outdraws the filled marks, which puts the
    // emphasis on the proteins the column says nothing about. Absent is not a
    // finding, so it recedes.
    return `<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}"
      r="2.6" fill="${c === null ? "none" : c}"
      fill-opacity="${c === null ? 1 : opacity}"
      stroke="${stroke}" stroke-width="${ring ? 1.3 : 1}"
      ${c === null ? 'stroke-opacity="0.45"' : ""}
      data-dot="${esc(label(p))}"><title>${esc(label(p))}</title></circle>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img"
      aria-label="2D UMAP of SAE feature vectors">${ctx}${dots}</svg>`;
}

// The sentinel for "no value" in a control's value attribute, since an
// <option value=""> already means "pick nothing". A column value that happens
// to equal this string would be indistinguishable from a null pick, which is
// why it is bracketed rather than a bare word.
const NULLV = "\u2205null\u2205";

// The colour legend. Identity is never colour alone: every slot is named, and
// the two cases a colour cannot express - a value outside the three slots, and
// no value at all - are named too rather than left to be guessed at.
function renderLegend(d) {
  const dom = d.domain;
  if (!dom) return "";
  // Counted over the points actually drawn, not over the column. The two
  // differ: the gene level holds every gene, the plot only the ones that were
  // embedded, and a filter narrows it further. Counting the column would have
  // the legend advertise a slot with nothing on screen under it - `known` is
  // exactly that, since s06 does not embed genes a family already explains.
  const tally = {};
  let missing = 0;
  for (const p of d.points) {
    if (p.s == null) missing++;
    else tally[p.s] = (tally[p.s] || 0) + 1;
  }
  const none = missing ? `<span class="key"><i class="hollow"></i>no value `
    + `(${missing})</span>` : "";
  if (dom.kind === "numeric") {
    return `<span class="key">${fmtNum(dom.min)}</span>`
      + `<span class="ramp">${RAMP.map((c, i) =>
          `<i style="background:${c}" title="${tally[i] || 0} proteins"></i>`
        ).join("")}</span>`
      + `<span class="key">${fmtNum(dom.max)}</span>`
      + (dom.log ? `<span class="key">log scale</span>` : "") + none;
  }
  // A slot with nothing drawn under it still appears, so the colours keep
  // meaning the same thing as the plot is filtered.
  return dom.slots.map((v, i) => `<span class="key"><i style="background:` +
      `${CAT_COLOR[i]}"></i>${esc(v)} (${tally[i] || 0})</span>`).join("")
    + (dom.folded ? `<span class="key" title="${dom.folded} further distinct `
        + `values share this colour"><i style="background:${CAT_OTHER}"></i>`
        + `other (${tally[-1] || 0})</span>` : "") + none;
}

// Colour and filter controls, built from the columns the run reports rather
// than from any list kept here - a stage added tomorrow that annotates genes
// becomes another thing to colour by with no change to this file.
function renderControls(run, d, comparing) {
  const cols = d.columns || [];
  const opts = [
    ...(comparing ? [["sample", "sample"]] : []),
    // Only a column worth colouring by: one colour per protein says nothing,
    // and a column with a single value says nothing either.
    ...cols.filter(c => c.usable).map(c => [c.name, c.name]),
  ];
  const current = comparing && !d.color ? "sample" : (d.color || "");
  const colourSel = `<span>colour by</span>
    <select data-colour="${esc(run.id)}">${opts.map(([v, t]) =>
      `<option value="${esc(v)}"${v === current ? " selected" : ""}>${esc(t)}`
      + `</option>`).join("")}</select>`;

  const terms = Object.entries(mapFilter).map(([name, t]) => {
    const c = cols.find(x => x.name === name);
    if (!c) return "";
    const drop = `<span class="drop" data-drop="${esc(name)}"
      title="remove this filter">&times;</span>`;
    if (t.op === "range") {
      return `<span class="term"><b>${esc(name)}</b>
        <input type="number" step="any" data-min="${esc(name)}"
          value="${t.min == null ? "" : t.min}" placeholder="${fmtNum(c.min)}">
        <span>to</span>
        <input type="number" step="any" data-max="${esc(name)}"
          value="${t.max == null ? "" : t.max}" placeholder="${fmtNum(c.max)}">
        ${drop}</span>`;
    }
    const chosen = t.values || [];
    const unchosen = (c.values || []).filter(v => !chosen.includes(v.value));
    const canAddNull = c.n_null && !chosen.includes(null);
    return `<span class="term"><b>${esc(name)}</b>${
      chosen.map(v => `<span class="val" data-unpick="${esc(name)}"
        data-value="${v === null ? NULLV : esc(v)}"
        title="remove this value">${v === null ? "no value" : esc(v)}</span>`
      ).join("")}${
      unchosen.length || canAddNull
        ? `<select data-pick="${esc(name)}"><option value="">+</option>${
            (canAddNull
              ? `<option value="${NULLV}">no value (${c.n_null})</option>` : "")
            + unchosen.map(v =>
              `<option value="${esc(v.value)}">${esc(v.value)} (${v.n})</option>`
            ).join("")}</select>`
        : ""}${drop}</span>`;
  }).join("");

  const free = cols.filter(c => c.kind !== "empty" && !(c.name in mapFilter));
  const addSel = free.length ? `<select data-addfilter="${esc(run.id)}">
      <option value="">filter by&hellip;</option>${free.map(c =>
        `<option value="${esc(c.name)}">${esc(c.name)}</option>`).join("")}
    </select>` : "";

  return `<div class="map-ctl">${colourSel}${addSel}${terms}
    ${d.n !== d.total ? `<span><b style="color:var(--ink)">${d.n}</b> of `
      + `${d.total} shown</span>` : ""}
    ${renderLegend(d)}</div>`;
}

function renderMap(run) {
  const open = mapRun === run.id;
  const cmp = open ? mapB : null;
  // Only a run that reached s06 has anything to draw.
  const others = allRuns.filter(r => r.id !== run.id &&
    (r.stages["s06_embed"] || {}).state === "done");
  const by = open && mapData && mapData.samples
    ? Object.fromEntries(mapData.samples.map(s => [s.side, s])) : null;
  const thinned = by && mapData.samples.some(s => s.subsampled);
  // Colour by sample unless a column was chosen: which run a protein came from
  // is the question an overlay was opened to answer. When a column *is*
  // chosen, colour carries it on both sides and run B takes a dark ring, so
  // the two stay tellable apart without spending a second hue on them.
  const bySample = !!by && !(mapData && mapData.color);

  const bar = `<div class="map-bar">
      <span class="seg">${[["reference", "shared map"],
                           ["run", cmp ? "these two only" : "this run only"]]
        .map(([m, label]) =>
        `<button data-map="${esc(run.id)}" data-mode="${m}"
          class="${open && mapMode === m ? "on" : ""}">${label}</button>`).join("")}</span>
      ${others.length ? `<select data-cmp="${esc(run.id)}"
          title="draw a second run's proteins in the same layout">
          <option value="">compare with&hellip;</option>
          ${others.map(r => `<option value="${esc(r.id)}"` +
            `${r.id === cmp ? " selected" : ""}>${esc(r.sample)}</option>`).join("")}
        </select>` : ""}
      ${open && mapData ? `<span>${mapData.shared_features}`
        + `/${mapData.distinct_features} features shared `
        + `(${Math.round(mapData.shared_frac * 100)}%)</span>` : ""}
      ${open && mapData && mapData.reference
        ? `<span class="key"><i style="background:var(--line)"></i>`
          + `${mapData.reference.n} reference</span>` : ""}
      ${open && mapData && mapData.mode === "run"
        ? `<span class="msg err">fitted on this run alone &mdash; not comparable `
          + `with other runs</span>` : ""}
      ${open && mapData && mapData.mode === "pair"
        ? `<span class="msg err">fitted on these two alone &mdash; comparable with `
          + `each other, with nothing else</span>` : ""}
      ${open && mapData && mapData.reference && mapData.reference.version_drift
        ? `<span class="msg err">reference built with different library `
          + `versions</span>` : ""}
      ${thinned ? `<span class="msg err">thinned to fit the plot &mdash; not every `
        + `protein is drawn</span>` : ""}
      ${open && mapData && by
        ? ["a", "b"].map(s => `<span class="key"><i style="${bySample
            ? `background:${SIDE_COLOR[s]}`
            : `background:transparent;border:1.5px solid var(--ink);` +
              `opacity:${s === "b" ? 1 : 0.25}`}"></i>` +
            `${esc(by[s].sample)} (${by[s].shown == null
              ? by[s].n : by[s].shown})</span>`).join("")
        : ""}
      ${mapHover ? `<span class="name">${esc(mapHover)}</span>` : ""}
    </div>`;
  if (!open) return `<div class="map">${bar}<p class="empty">Plot this run's
    SAE features on the shared UMAP layout${others.length
      ? `, on their own or against another run` : ""}.</p></div>`;
  if (mapErr) return `<div class="map">${bar}<p class="msg err">${esc(mapErr)}</p></div>`;
  if (!mapData) return `<div class="map">${bar}<p class="empty">projecting&hellip;</p></div>`;

  const dom = mapData.domain;
  const fill = bySample ? p => SIDE_COLOR[p.side] || "var(--map-context)"
                        : p => slotColor(p, dom);
  const label = p => [p.id, by ? (by[p.side] || {}).sample : null,
                      mapData.color ? `${mapData.color}=${p.v == null ? "-"
                        : (typeof p.v === "number" ? fmtNum(p.v) : p.v)}` : null]
    .filter(Boolean).join(" · ");
  return `<div class="map">${bar}${renderControls(run, mapData, !!by)}${
    mapScatter(mapData, fill, label, by ? 0.7 : 0.85,
               bySample ? null : (by ? "b" : null))}</div>`;
}

function renderDetail(run) {
  const known = artifacts[run.id];
  const rows = (run.order || Object.keys(run.stages)).map(s => {
    const d = run.stages[s];
    const files = renderFiles(run.id, s);
    const fileRow = files ? `<tr><td colspan="4">${files}</td></tr>` : "";
    if (d.state !== "done")
      return `<tr><td class="k">${esc(s)}</td><td colspan="3">${esc(d.state)}</td></tr>${fileRow}`;
    const stats = Object.entries(d.stats).map(([k, v]) => `${k}=${v}`).join("  ");
    // Columns the stage contributed, and the selection it ran on. Both come
    // from the manifest, so this renders for a stage nothing here knows.
    const cols = (d.tables || []).map(t =>
      `<div class="cols"><span class="sub">${esc(t.level)}${
        t.where ? " where " + esc(t.where) : ""}:</span> ` +
      t.columns.map(c => `<span class="col">${esc(c)}</span>`).join("") + `</div>`
    ).join("");
    return `<tr><td class="k">${esc(s)}</td><td>${fmtSecs(d.seconds)}</td>` +
           `<td>${esc(d.output)} <span class="sub">${fmtBytes(d.bytes)}</span></td>` +
           `<td>${esc(stats || "—")}${cols}</td></tr>${fileRow}`;
  }).join("");
  const note = known ? "" : `<p class="empty">loading files…</p>`;
  // Drawn when some stage that declares the projection role has run here —
  // a capability, not a stage name.
  const plotters = (PIPELINE?.stages || [])
    .filter(x => x.roles.includes("projection")).map(x => x.name);
  const map = plotters.some(n => run.stages[n]) ? renderMap(run) : "";
  return `<div class="detail"><table><tr><th>stage</th><th>time</th>` +
         `<th>output</th><th>stats</th></tr>${rows}</table>${note}` +
         map + renderPreview() + `</div>`;
}

async function loadArtifacts(runId) {
  if (artifacts[runId] || pendingArtifacts[runId]) return;
  pendingArtifacts[runId] = true;
  try {
    const d = await api("/api/artifacts?run=" + encodeURIComponent(runId));
    artifacts[runId] = d.stages;
    refresh();
  } catch (e) { artifacts[runId] = {}; }
  delete pendingArtifacts[runId];
}

// The filter as the server takes it: one term per column, ANDed, and a term
// that constrains nothing is left out rather than sent as an empty clause.
function filterTerms() {
  return Object.entries(mapFilter).flatMap(([col, t]) => {
    if (t.op === "range") {
      return (t.min == null && t.max == null) ? []
        : [{col, op: "range", min: t.min ?? null, max: t.max ?? null}];
    }
    return (t.values || []).length ? [{col, op: "in", values: t.values}] : [];
  });
}

async function loadMap(runId, mode, b) {
  b = b || null;
  const terms = filterTerms();
  // Colour and filter are part of a request's identity, so changing either
  // refetches while the 2s poll, which changes neither, does not.
  const key = [runId, mode, b || "", mapColor, JSON.stringify(terms)].join("|");
  if (mapKey === key && (mapData || mapErr)) return;
  mapKey = key;
  mapRun = runId; mapMode = mode; mapB = b; mapData = null; mapErr = null;
  refresh();
  try {
    mapData = await api(`/api/projection?run=${encodeURIComponent(runId)}` +
                        `&mode=${encodeURIComponent(mode)}` +
                        (b ? `&b=${encodeURIComponent(b)}` : "") +
                        (mapColor ? `&color=${encodeURIComponent(mapColor)}` : "") +
                        (terms.length
                          ? `&filter=${encodeURIComponent(JSON.stringify(terms))}`
                          : ""));
  } catch (e) { mapErr = e.message; }
  refresh();
}

// Re-request the map after a control changed, keeping run and mode.
const remap = () => loadMap(mapRun, mapMode, mapB);

async function selectFile(run, stage, file) {
  if (sel && sel.run === run && sel.stage === stage && sel.file === file) {
    sel = null; selData = null; refresh(); return;
  }
  sel = {run, stage, file}; selData = null; refresh();
  try {
    selData = await api(`/api/preview?run=${encodeURIComponent(run)}` +
      `&stage=${encodeURIComponent(stage)}&file=${encodeURIComponent(file)}`);
  } catch (e) { selData = {kind: "text", text: e.message, bytes: 0}; }
  refresh();
}

function renderRuns(runs, jobs) {
  const el = $("runs");
  allRuns = runs;
  if (!runs.length) {
    paint(el, '<p class="empty">No runs found in the work roots.</p>');
    return;
  }
  const activeBySample = {};
  jobs.filter(j => j.state === "running").forEach(j => activeBySample[j.sample] = j.stage);
  const html = runs.map(r => {
    const active = activeBySample[r.sample];
    return `<div class="run" data-id="${r.id}">
      <div class="run-head"><span class="name">${r.sample}</span>
        <span class="sub">${r.done}/${STAGES.length} stages</span>
        <span class="sub">${r.updated || ""}</span>
        ${active ? '<span class="badge running">running</span>' : ""}</div>
      <div class="strip">${stageCells(r, active)}</div>
      ${openRun === r.id ? renderDetail(r) : ""}
    </div>`;
  }).join("");
  if (!paint(el, html)) { if (openRun) loadArtifacts(openRun); return; }
  el.querySelectorAll(".run").forEach(n => {
    const toggle = () => {
      openRun = openRun === n.dataset.id ? null : n.dataset.id;
      if (!openRun) {
        sel = null; selData = null; mapRun = null; mapB = null; mapData = null;
        mapColor = ""; mapFilter = {}; mapKey = null;
      }
      refresh();
    };
    n.querySelectorAll(":scope > .run-head, :scope > .strip")
      .forEach(h => h.onclick = toggle);
  });
  el.querySelectorAll("[data-map]").forEach(n => n.onclick = () =>
    loadMap(n.dataset.map, n.dataset.mode,
            mapRun === n.dataset.map ? mapB : null));
  el.querySelectorAll("[data-cmp]").forEach(n => n.onchange = () =>
    loadMap(n.dataset.cmp, mapRun === n.dataset.cmp ? mapMode : "reference",
            n.value || null));
  // Colour and filter controls. Every one of them only mutates state and
  // re-requests; what the controls *are* came from the response, so nothing
  // here knows a column name.
  el.querySelectorAll("[data-colour]").forEach(n => n.onchange = () => {
    mapColor = n.value; remap();
  });
  el.querySelectorAll("[data-addfilter]").forEach(n => n.onchange = () => {
    const name = n.value;
    if (!name) return;
    const c = (mapData.columns || []).find(x => x.name === name);
    if (!c) return;
    // A new term starts unconstrained, so adding one never hides anything
    // before it has been said what to keep.
    mapFilter[name] = c.kind === "numeric"
      ? {op: "range", min: null, max: null} : {op: "in", values: []};
    refresh();
  });
  el.querySelectorAll("[data-drop]").forEach(n => n.onclick = () => {
    delete mapFilter[n.dataset.drop]; remap();
  });
  el.querySelectorAll("[data-pick]").forEach(n => n.onchange = () => {
    const t = mapFilter[n.dataset.pick];
    if (!t || !n.value) return;
    t.values.push(n.value === NULLV ? null : n.value);
    remap();
  });
  el.querySelectorAll("[data-unpick]").forEach(n => n.onclick = () => {
    const t = mapFilter[n.dataset.unpick];
    if (!t) return;
    const v = n.dataset.value === NULLV ? null : n.dataset.value;
    t.values = t.values.filter(x => x !== v);
    remap();
  });
  // On change, not input: applying mid-keystroke would refetch on every digit
  // and the repaint would take the caret with it.
  ["min", "max"].forEach(k =>
    el.querySelectorAll(`[data-${k}]`).forEach(n => n.onchange = () => {
      const t = mapFilter[n.dataset[k]];
      if (!t) return;
      t[k] = n.value === "" ? null : Number(n.value);
      remap();
    }));
  el.querySelectorAll("circle[data-dot]").forEach(n =>
    n.onmouseenter = () => { mapHover = n.dataset.dot; refresh(); });
  el.querySelectorAll(".chip").forEach(n => n.onclick = () => {
    if (n.classList.contains("binary")) return;
    selectFile(n.dataset.run, n.dataset.stage, n.dataset.file);
  });
  if (openRun) loadArtifacts(openRun);
}

function renderJobs(jobs) {
  const el = $("jobs");
  if (!jobs.length) {
    paint(el, '<p class="empty">No runs started from here yet.</p>');
    return;
  }
  const html = jobs.map(j => `<div class="run" data-job="${j.id}">
      <div class="run-head"><span class="name">${j.sample}</span>
        <span class="badge ${j.state}">${j.state}</span>
        <span class="sub">${j.stage || "starting"} · ${fmtSecs(j.elapsed)}</span>
        ${j.backend_id ? `<span class="sub">${esc(j.backend || "")} ${esc(j.backend_id)}</span>` : ""}</div>
      ${j.hint ? `<div class="msg err">${esc(j.hint)}</div>` : ""}
      ${openJob === j.id ? jobPanes(j) : ""}
    </div>`).join("");
  paint(el, html);
  el.querySelectorAll(".run").forEach(n =>
    n.querySelectorAll(":scope > .run-head").forEach(h => h.onclick = () => {
      openJob = openJob === n.dataset.job ? null : n.dataset.job; refresh();
    }));
  el.querySelectorAll("[data-pane]").forEach(n => n.onclick = () => {
    jobPane = n.dataset.pane; refresh();
  });
  // Stash the text and let the next poll render it. Patching the node after
  // paint would be undone by the following repaint; calling refresh() from
  // here would recurse. The id is captured because the poll is in flight
  // while the user can still switch jobs.
  const jid = openJob;
  if (!jid) return;
  api("/api/log?id=" + encodeURIComponent(jid))
    .then(d => { jobLog[jid] = d.log || "(no output yet)"; })
    // Say why, rather than leaving "loading…" up forever — a silent failure
    // here is indistinguishable from a job that has printed nothing. Text
    // already fetched is kept: the poll retries, so one bad tick is not worth
    // throwing away a log over.
    .catch(e => { jobLog[jid] ??= "(no output: " + e.message + ")"; });
  const got = jobScript[jid];
  if (got?.ok) return;                          // have it; it cannot change
  const job = jobs.find(x => x.id === jid);
  if (job && job.script_path === undefined) {
    // The page is read from disk on every request, so it can be newer than the
    // process serving it, and then /api/script is simply not there. Its 404
    // would read as "this job has no script", which is the wrong thing to go
    // looking for. Left not-ok, so restarting the server clears it.
    jobScript[jid] = {text: "(this server was started before the script view " +
                            "existed — restart it to see submitted scripts)"};
  } else if (!got?.pending) {
    // Keep showing the last message while the retry is in flight, rather than
    // flicking back to "loading…" every couple of seconds.
    jobScript[jid] = {pending: true, text: got?.text ?? "loading…"};
    api("/api/script?id=" + encodeURIComponent(jid))
      .then(d => { jobScript[jid] = {ok: true, text: d.script
                     || "(the script is no longer on disk" +
                        (d.path ? ": " + d.path : "") + ")"}; })
      .catch(e => { jobScript[jid] = {text: "(" + e.message + ")"}; });
  }
}

// What was run, next to what it printed. The script is the whole job —
// limits included — read back from disk rather than reconstructed, so it is
// evidence about *this* job rather than about what the server would run now.
function jobPanes(j) {
  const script = jobPane === "script";
  const path = script ? j.script_path : j.log_path;
  return `<div class="bar">
      <span class="seg">
        <button data-pane="output" class="${script ? "" : "on"}">output</button>
        <button data-pane="script" class="${script ? "on" : ""}">script</button>
      </span>
      <span class="path">${esc(path || "")}</span>
    </div>
    <pre data-key="${script ? "script" : "log"}|${j.id}">${esc(
      script ? (jobScript[j.id]?.text ?? "loading…")
             : (jobLog[j.id] ?? "loading…"))}</pre>`;
}

// ---------------------------------------------------------------------------
// The launch form, generated from the pipeline's own description of itself.
//
// Nothing below names a stage, a parameter or a column. The server sends the
// stages, each stage's parameters with type / default / choices / help, which
// entity level each one reads, and whether it takes a selection; this builds
// controls out of that. A new stage, a renamed flag or a different pipeline
// entirely all arrive as data.
// ---------------------------------------------------------------------------
function paramControl(stage, p) {
  const id = `p|${stage.name}|${p.name}`;
  const ph = p.default === null || p.default === undefined ? "" : String(p.default);
  let control;
  if (p.path) {
    // Options are filled in by fillPathOptions once /api/state has listed what
    // is actually on disk, filtered by the suffixes this parameter declares.
    control = `<select id="${esc(id)}" data-path="${esc(p.suffixes.join(","))}" ` +
              `data-prefer="${p.prefer_available ? "1" : "0"}"></select>`;
  } else if (p.choices) {
    control = `<select id="${esc(id)}">` +
      (p.default === null ? `<option value="">—</option>` : "") +
      p.choices.map(c =>
        `<option${c === String(p.default) ? " selected" : ""}>${esc(c)}</option>`
      ).join("") + `</select>`;
  } else if (p.type === "bool") {
    control = `<select id="${esc(id)}">` +
      `<option value=""${p.default ? " selected" : ""}>yes (default)</option>` +
      `<option value="0"${p.default ? "" : " selected"}>no</option></select>`;
  } else {
    control = `<input id="${esc(id)}" placeholder="${esc(ph)}">`;
  }
  return `<div><label for="${esc(id)}" title="${esc(p.help)}">${esc(p.name)}` +
         `</label>${control}` +
         (p.help ? `<div class="hint">${esc(p.help)}</div>` : "") + `</div>`;
}

async function renderOptions() {
  if (!PIPELINE) return;
  const target = $("target").value;
  // Offered only when an assembler is actually in the way *and* the planner
  // finds a route without it. Asking for both plans is how we know; guessing
  // would put the box on screen promising a route that does not exist.
  const asm = PIPELINE.stages.filter(s => (s.roles || []).includes("assembly"))
                             .map(s => s.name);
  const [withAsm, without] = await Promise.all(
    [planFor(target, []), planFor(target, asm)]);
  const uses = p => p.some(s => asm.includes(s.name));
  const offerable = asm.length && uses(withAsm) && without.length
                    && !uses(without);
  $("fast-wrap").style.display = offerable ? "" : "none";
  if (!offerable) $("fast").checked = false;
  $("fast-hint").textContent = offerable
    ? "every peptide is a read-length fragment, so it cannot carry a complete "
      + "domain — a triage picture, not evidence about a protein"
    : "";

  const plan = $("fast").checked ? without : withAsm;
  $("plan").innerHTML = plan.length
    ? `<span class="sub">plan:</span> ` + plan.map(s =>
        `<span class="cell done" title="${esc(s.summary)}">${esc(s.title)}</span>`).join("")
    : `<span class="sub">nothing to run for that target</span>`;

  const html = plan.map(s => {
    const missing = s.requires.filter(t => !t.available && !t.optional);
    const soft = s.requires.filter(t => !t.available && t.optional);
    const sel = s.selectable ? `
      <div class="sel">
        <label for="w|${esc(s.name)}">selection — SQL over the
          <code>${esc(s.consumes)}</code> level</label>
        <input id="w|${esc(s.name)}" class="where" data-stage="${esc(s.name)}"
               data-level="${esc(s.consumes)}"
               placeholder="${esc(s.default_where || "all rows")}">
        <div class="hint" id="wc|${esc(s.name)}">${
          s.default_where
            ? "default: " + esc(s.default_where)
            : "leave empty to take every row"}</div>
      </div>` : "";
    return `<fieldset>
      <legend>${esc(s.title)} <span class="sub">${esc(s.name)} ·
        ${esc(s.consumes)} → ${esc(s.produces)}</span></legend>
      <div class="hint">${esc(s.summary)}</div>
      ${missing.length ? `<div class="msg err">needs ${missing.map(t =>
          esc(t.name)).join(", ")} — not installed</div>` : ""}
      ${soft.length ? `<div class="hint">without ${soft.map(t =>
          esc(t.name) + (t.hint ? " (" + esc(t.hint) + ")" : "")).join(", ")}</div>` : ""}
      ${sel}
      ${s.params.length ? `<div class="row">` +
        s.params.map(p => paramControl(s, p)).join("") + `</div>` : ""}
    </fieldset>`;
  }).join("");
  if ($("opts")._html !== html) { $("opts").innerHTML = html; $("opts")._html = html; }
  fillPathOptions();
  $("opts").querySelectorAll(".where").forEach(n => {
    n.oninput = () => scheduleCount(n);
  });
}

// Stages filling a capability the run has switched off. A role, not a stage
// name: any assembler fills "assembly", so this file still names no stage.
function skipped() {
  if (!PIPELINE || !$("fast").checked) return [];
  return PIPELINE.stages.filter(s => (s.roles || []).includes("assembly"))
                        .map(s => s.name);
}

// What would run, from the driver's planner rather than a copy of it here.
// The page used to walk the ports itself. That held only while one stage
// consumed each port: the moment two did - assemble and translate both take
// reads - the greedy walk returned the union of both routes, and it could not
// tell that switching off the assembler leaves no route to contigs at all. So
// the preview asks, and what it shows is what will run. Answers are cached
// per (input, target, skip) because they only change when the registry does.
const planCache = new Map();
async function planFor(target, off) {
  if (!PIPELINE || !target) return [];
  const qs = new URLSearchParams({have: $("kind").value, want: target});
  (off || []).forEach(n => qs.append("skip", n));
  const key = qs.toString();
  if (!planCache.has(key)) {
    planCache.set(key, api("/api/plan?" + key)
      .then(d => (d.stages || []).map(n =>
        PIPELINE.stages.find(s => s.name === n)).filter(Boolean))
      .catch(() => []));
  }
  return planCache.get(key);
}

// A path parameter offers whatever the server found under data/ with one of
// the suffixes that parameter declared.
function fillPathOptions() {
  const files = DATA_FILES;
  $("opts").querySelectorAll("select[data-path]").forEach(n => {
    const want = n.dataset.path.split(",").filter(Boolean);
    const hits = files.filter(f => !want.length || want.includes(f.suffix));
    const html = `<option value="">—</option>` + hits.map(f =>
      `<option value="${esc(f.path)}">${esc(f.name)} (${fmtBytes(f.bytes)})</option>`
    ).join("");
    if (n._html === html) return;
    const keep = n.value;
    n.innerHTML = html; n._html = html;
    // Only parameters that asked for it are pre-filled. A path parameter left
    // empty usually means "do not do this part", and choosing a file for one
    // on the strength of a matching extension picks a backend nobody asked
    // for — the declaration says which ones want a default.
    n.value = keep ||
      (n.dataset.prefer === "1" && hits.length ? hits[0].path : "");
  });
}

// Live match count for a predicate, when the sample named in the form already
// has rows to count. That is the whole point of writing one in a box rather
// than in a shell: you see what it selects before spending a GPU on it.
let countTimer = null;
function scheduleCount(node) {
  clearTimeout(countTimer);
  countTimer = setTimeout(() => runCount(node), 350);
}
async function runCount(node) {
  const el = $("wc|" + node.dataset.stage);
  if (!el) return;
  const sample = $("sample").value.trim();
  const run = allRuns.find(r => r.sample === sample);
  const where = node.value.trim();
  if (!run || !run.levels?.includes(node.dataset.level)) {
    el.textContent = where
      ? "no existing rows for this sample to count against"
      : (node.placeholder === "all rows" ? "leave empty to take every row"
                                         : "default: " + node.placeholder);
    return;
  }
  try {
    const d = await api("/api/query?run=" + encodeURIComponent(run.id) +
      "&level=" + encodeURIComponent(node.dataset.level) +
      "&limit=1&where=" + encodeURIComponent(where));
    el.textContent = `${d.matched} of ${run.sample}'s ${node.dataset.level} rows`;
    el.className = "hint";
  } catch (e) { el.textContent = e.message; el.className = "hint bad"; }
}

async function loadPipeline() {
  PIPELINE = await api("/api/pipeline");
  $("fast").onchange = renderOptions;
  // Targets are ports something can produce — levels and file kinds alike, so
  // "assemble only" and "all the way to features" are the same kind of choice.
  const ports = [...new Set(PIPELINE.stages.flatMap(s =>
    [s.produces, ...s.also_produces]))];
  const label = {};
  for (const l of PIPELINE.levels) label[l.name] = l.title || l.name;
  for (const k of PIPELINE.file_kinds) label[k.name] = k.summary;
  $("target").innerHTML = ports.map(p =>
    `<option value="${esc(p)}">${esc(label[p] || p)} (${esc(p)})</option>`).join("");
  $("target").value = ports.includes("feature") ? "feature" : ports[ports.length - 1];
  $("kind").innerHTML = PIPELINE.file_kinds.map(k =>
    `<option value="${esc(k.name)}">${esc(k.name)} — ${esc(k.summary)}</option>`).join("");
  $("target").onchange = renderOptions;
  $("kind").onchange = renderOptions;
  renderOptions();
}

async function refresh() {
  try {
    const s = await api("/api/state");
    STAGES = s.stages; readOnly = s.read_only;
    DATA_FILES = s.data_files || [];
    $("env").textContent =
      `${s.container ? s.container + " container" : "host"} · work: ${s.roots.join("  ")}` +
      (readOnly ? " · read-only" : "");
    if (readOnly) { $("new-run").style.display = "none"; }
    else if (PIPELINE) fillPathOptions();
    renderJobs(s.jobs);
    renderRuns(s.runs, s.jobs);
  } catch (e) { $("env").textContent = "server unreachable: " + e.message; }
}

async function loadInputs(selected) {
  const d = await api("/api/inputs");
  const opts = '<option value="">—</option>' + d.files.map(f =>
    `<option value="${f.path}">${f.name} (${fmtBytes(f.bytes)})</option>`).join("");
  $("input").innerHTML = opts; $("input2").innerHTML = opts;
  if (selected) $("input").value = selected;
}

$("file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  $("msg").className = "msg"; $("msg").textContent = `uploading ${f.name}…`;
  try {
    const d = await api("/api/upload?name=" + encodeURIComponent(f.name),
                        {method: "POST", body: f});
    $("msg").className = "msg ok";
    $("msg").textContent = `uploaded ${d.name} (${fmtBytes(d.bytes)})`;
    await loadInputs(d.path);
  } catch (err) { $("msg").className = "msg err"; $("msg").textContent = err.message; }
};

$("go").onclick = async () => {
  // Collected by walking the generated controls, so the body carries exactly
  // the parameters the stages declared and nothing this file decided on.
  const params = {}, where = {};
  $("opts").querySelectorAll("[id^='p|']").forEach(n => {
    const [, stage, name] = n.id.split("|");
    const v = String(n.value).trim();
    if (v === "") return;
    (params[stage] ||= {})[name] = v;
  });
  $("opts").querySelectorAll(".where").forEach(n => {
    const v = n.value.trim();
    if (v) where[n.dataset.stage] = v;
  });
  const body = {
    sample: $("sample").value.trim(), input_kind: $("kind").value,
    input_path: $("input").value, input_path2: $("input2").value || null,
    target: $("target").value, params, where, skip: skipped(),
  };
  $("go").disabled = true; $("msg").className = "msg"; $("msg").textContent = "starting…";
  try {
    const j = await api("/api/run", {method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    $("msg").className = "msg ok"; $("msg").textContent = "started job " + j.id;
    openJob = j.id; await refresh();
  } catch (e) { $("msg").className = "msg err"; $("msg").textContent = e.message; }
  $("go").disabled = false;
};

loadPipeline().catch(e => {
  $("msg").className = "msg err";
  $("msg").textContent = "cannot read the pipeline description: " + e.message;
});
refresh(); loadInputs().catch(() => {});
setInterval(refresh, 2000);
</script>
</body>
</html>
